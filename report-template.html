  :root{
    --bg:#FFFCF7; --card:#FFFFFF; --border:#EDE5D8; --mint:#BFE1D2;
    --ink:#192949; --ink-soft:#3F5C98; --ink-muted:#7C89AA;
    --coral:#F27D68;      /* decorative: logo dot, large accents */
    --coral-ink:#CA290C;  /* icons, single-series bar fill, small marks */
    --teal:#31C0BA;       /* decorative */
    --teal-ink:#25928E;   /* after-state check, icons needing contrast */
    --ramp-1:#F5735C; --ramp-2:#F14222; --ramp-3:#CA290C; --ramp-4:#901D09; --ramp-5:#601406;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:28px 20px; background:var(--bg); color:var(--ink);
    font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.5; font-weight:400;
  }
  .wrap{max-width:980px; margin:0 auto;}

  header.report-header{margin-bottom:28px;}
  .logo-img{height:34px; display:block; margin-bottom:18px;}
  .header-row{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px;}
  .header-titles h1{font-size:1.5rem; margin:0 0 4px 0; font-weight:600;}
  .meta-line{color:var(--ink-soft); font-size:0.95rem;}
  .tone-chip{
    display:inline-block; margin-top:10px; padding:5px 14px; border-radius:999px;
    background:var(--mint); color:var(--ink); font-size:0.85rem; font-weight:600;
  }

  /* Stat tiles */
  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:26px 0 34px 0;}
  @media (max-width:680px){ .stat-row{grid-template-columns:1fr;} }
  .stat-tile{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px;
  }
  .stat-value{font-size:2.1rem; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums;}
  .stat-label{font-size:0.82rem; color:var(--ink-soft); margin-top:4px; font-weight:400;}
  .stat-sub{font-size:0.85rem; color:var(--ink-muted); margin-top:2px;}

  section{margin-bottom:40px;}
  h2.section-title{font-size:1.02rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); margin:0 0 14px 0; font-weight:600;}
  p.overview-text{font-size:1.02rem; max-width:70ch;}

  .cluster-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:680px){ .cluster-grid{grid-template-columns:1fr;} }

  .cluster-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; box-shadow:0 1px 3px rgba(25,41,73,0.05);
    display:flex; flex-direction:column;
  }
  .cluster-card.is-clean{ background:#F2F8F5; border-color:#DCEAE3; }
  .cluster-card.is-clean .clean-state{flex:1; display:flex; align-items:center; margin:8px 0 0 0;}
  .cluster-card .badge-row{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;}
  .badge-name{display:flex; align-items:center; gap:9px; font-weight:600; font-size:0.98rem;}
  .badge-icon{width:30px; height:30px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:50%; background:#FBEAE5; color:var(--coral-ink);}
  .is-clean .badge-icon{ background:#DCEAE3; color:var(--teal-ink); }
  .badge-icon svg{width:16px; height:16px;}
  .badge-count{
    font-size:0.76rem; color:var(--ink-soft); background:#F5F2EC; border:1px solid var(--border);
    border-radius:999px; padding:3px 11px; white-space:nowrap; font-weight:600;
  }
  .cluster-card .label{font-size:0.7rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-muted); margin:12px 0 4px 0; font-weight:600;}
  .cluster-card .label:first-of-type{margin-top:0;}
  .quote-block{font-style:italic; font-size:0.95rem; border-left:3px solid var(--coral); padding-left:10px; margin:0;}
  .effect-text{font-size:0.92rem; margin:0; display:flex; gap:8px; align-items:flex-start;}
  .effect-text .icon{flex:none; margin-top:2px; color:var(--ink-soft);}
  .shift-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  @media (max-width:420px){ .shift-grid{grid-template-columns:1fr;} }
  .shift-box{font-size:0.88rem; background:#F8F7F3; border:1px solid var(--border); border-radius:8px; padding:8px 10px;}
  .shift-box .tag{display:flex; align-items:center; gap:5px; font-size:0.72rem; color:var(--ink-soft); margin-bottom:4px; font-weight:600;}
  .clean-state{font-size:0.9rem; color:var(--teal-ink); margin:0; display:flex; gap:8px; align-items:center;}

  /* Frequency + distribution */
  .viz-panels{display:grid; grid-template-columns:1.1fr 0.9fr; gap:20px; align-items:stretch;}
  @media (max-width:760px){ .viz-panels{grid-template-columns:1fr;} }
  .viz-panel{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px 22px;}
  .viz-panel h3{font-size:0.85rem; font-weight:600; color:var(--ink-soft); margin:0 0 16px 0;}

  .chart-bars{display:flex; flex-direction:column; gap:12px;}
  .chart-row{display:flex; align-items:center; gap:10px;}
  .chart-label{width:170px; font-size:0.82rem; flex:none; color:var(--ink);}
  .chart-track{flex:1; background:#F2EFE8; border-radius:6px; height:14px; overflow:hidden;}
  .chart-fill{height:100%; border-radius:6px; background:var(--coral-ink);}
  .chart-count{width:22px; text-align:right; font-size:0.82rem; color:var(--ink-soft); flex:none; font-variant-numeric:tabular-nums;}
  .chart-note{font-size:0.92rem; color:var(--ink-soft); font-style:italic;}

  .radar-wrap{display:flex; flex-direction:column; align-items:center; gap:12px;}
  .radar-svg{width:220px; height:220px; overflow:visible;}
  .radar-grid{fill:none; stroke:#EDE7DC; stroke-width:1;}
  .radar-spoke{stroke:#EDE7DC; stroke-width:1;}
  .radar-shape{fill:rgba(202,41,12,0.13); stroke:var(--coral-ink); stroke-width:2; stroke-linejoin:round;}
  .radar-dot{stroke:var(--card); stroke-width:1.5;}
  .radar-value-label{font-size:9px; font-weight:700; fill:var(--ink); font-family:"Outfit",sans-serif;}
  .radar-axis-label{font-size:8.5px; fill:var(--ink-soft); font-family:"Outfit",sans-serif; font-weight:600;}
  .radar-caption{font-size:0.78rem; color:var(--ink-soft); text-align:center; max-width:260px;}
  .privacy-line{display:flex; align-items:center; gap:6px; font-size:0.82rem; color:var(--ink-soft); margin-top:8px;}
  .privacy-line svg{flex:none; color:var(--ink-muted);}

  ul.source-list{margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:6px;}
  ul.source-list li{font-size:0.9rem;}
  ul.source-list a{color:var(--ink); text-decoration:underline; text-decoration-color:var(--border);}

  .closing-note{font-size:1rem; max-width:70ch; background:var(--mint); border-radius:12px; padding:16px 20px; color:var(--ink);}

  footer.report-footer{border-top:1px solid var(--border); padding-top:14px; font-size:0.78rem; color:var(--ink-muted);}
</style>
</head>

<div class="wrap" id="app"></div>

    // Key numbers
    html += '<div class="stat-row">'
      + '<div class="stat-tile"><div class="stat-value">' + total + '</div><div class="stat-label">' + LABELS.totalLabel + '</div></div>'

    // Frequency (shared) + personal intensity radar
    var ownIntensity = data.own_intensity || {};
    html += '<section><h2 class="section-title">' + LABELS.frequency + ' &amp; ' + LABELS.yourProfile + '</h2>';
    if (data.frequency_applicable === false) {
      html += '<p class="chart-note">' + esc(data.frequency_note || "This conversation is too short to visualize meaningfully.") + '</p>';
    } else {
      var max = Math.max.apply(null, counts.concat([1]));
      html += '<div class="viz-panels">';

      // Bar chart panel (shared, conversation-wide counts)
      html += '<div class="viz-panel"><h3>' + LABELS.frequency + ' per cluster</h3><div class="chart-bars">';
      CLUSTERS.forEach(function(c, i){
        var n = counts[i];
        var pct = Math.round((n / max) * 100);
        html += '<div class="chart-row">'
          + '<div class="chart-label">' + esc(c.name) + '</div>'
          + '<div class="chart-track"><div class="chart-fill" style="width:' + pct + '%" title="' + esc(c.name) + ': ' + n + '"></div></div>'
          + '<div class="chart-count">' + n + '</div>'
          + '</div>';
      });
      html += '</div></div>';

      // Radar chart panel (personal — this viewer's own_intensity only)
      html += '<div class="viz-panel"><h3>' + LABELS.yourProfile + '</h3><div class="radar-wrap">';
      var R = 78, CX = 100, CY = 96;
      var N = CLUSTERS.length;
      var angleFor = function(i){ return (-90 + i * (360 / N)) * Math.PI / 180; };
      var pointAt = function(i, r){ return { x: CX + r * Math.cos(angleFor(i)), y: CY + r * Math.sin(angleFor(i)) }; };

      var svg = '<svg class="radar-svg" viewBox="0 0 200 200">';
      // grid rings at 2/4/6/8/10
      [2,4,6,8,10].forEach(function(g){
        var r = (g/10) * R;
        var pts = CLUSTERS.map(function(c,i){ var p = pointAt(i, r); return p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
        svg += '<polygon class="radar-grid" points="' + pts + '"></polygon>';
      });
      // spokes + axis labels
      CLUSTERS.forEach(function(c, i){
        var edge = pointAt(i, R);
        svg += '<line class="radar-spoke" x1="' + CX + '" y1="' + CY + '" x2="' + edge.x.toFixed(1) + '" y2="' + edge.y.toFixed(1) + '"></line>';
        var lp = pointAt(i, R + 16);
        var anchor = Math.abs(lp.x - CX) < 4 ? 'middle' : (lp.x > CX ? 'start' : 'end');

      });
      // data shape
      var values = CLUSTERS.map(function(c){ var v = ownIntensity[c.key]; return (typeof v === 'number') ? Math.max(0, Math.min(10, v)) : 0; });
      var shapePts = CLUSTERS.map(function(c, i){ var p = pointAt(i, (values[i]/10) * R); return p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
      svg += '<polygon class="radar-shape" points="' + shapePts + '"></polygon>';
      // vertex dots + value labels
      CLUSTERS.forEach(function(c, i){
        var p = pointAt(i, (values[i]/10) * R);
        svg += '<circle class="radar-dot" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4" fill="' + intensityColor(values[i]) + '"><title>' + esc(c.name) + ': ' + values[i] + ' / 10</title></circle>';
        var lp2 = pointAt(i, (values[i]/10) * R + 11);
        svg += '<text class="radar-value-label" x="' + lp2.x.toFixed(1) + '" y="' + lp2.y.toFixed(1) + '" text-anchor="middle" dominant-baseline="middle">' + values[i] + '</text>';
      });
      svg += '</svg>';
      html += svg;
      html += '<p class="radar-caption">' + LABELS.radarCaption + '</p>';
      html += '</div></div>'; // radar-wrap, viz-panel

      html += '</div>'; // viz-panels

    html += '<section><h2 class="section-title">' + LABELS.patterns + '</h2><div class="cluster-grid">';
    CLUSTERS.forEach(function(c){
      var cd = clusters[c.key] || {};

      var clean = count === 0;
      html += '<div class="cluster-card' + (clean ? ' is-clean' : '') + '">'

        + '</div>';
      if (!clean && cd.quote) {

          + '<p class="effect-text"><span class="icon">' + ICONS.eye + '</span><span>' + esc(cd.effect || "") + '</span></p>'
          + '<div class="label">The Micro-Shift</div>'
          + '<div class="shift-grid">'
          +   '<div class="shift-box"><div class="tag">' + ICONS.cross + ' ' + LABELS.before + '</div>' + esc(cd.before || "") + '</div>'
          +   '<div class="shift-box"><div class="tag" style="color:var(--teal-ink)">' + ICONS.check + ' ' + LABELS.after + '</div>' + esc(cd.after || "") + '</div>'
          + '</div>';
      } else {
        html += '<p class="clean-state">' + ICONS.check + ' ' + LABELS.cleanState + '</p>';
      }
      html += '</div>';
    });
    html += '</div></section>';

    // Sourced context
    var sources = data.sourced_context || [];
    if (sources.length > 0) {
      html += '<section><h2 class="section-title">' + LABELS.sources + '</h2><ul class="source-list">';
      sources.forEach(function(s){
        var label = esc(s.concept || "") + (s.note ? ' — ' + esc(s.note) : '');
        html += '<li>' + (s.url ? ('<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + label + '</a>') : label) + '</li>';
      });
      html += '</ul></section>';
    }

    // Closing note
    html += '<section><h2 class="section-title">' + LABELS.closing + '</h2>'
      + '<p class="closing-note">' + esc(data.closing_note || "") + '</p></section>';

    // Footer
    html += '<footer class="report-footer">' + LABELS.footer + '</footer>';

    app.innerHTML = html;
  }

  var raw = document.getElementById('report-data').textContent.trim();
  var data = {};
  try {
    if (raw) { data = JSON.parse(raw); }
  } catch (e) {
    data = {};
    console.error('Better Said: could not parse report data (template placeholder not substituted yet?)', e);
  }
  renderReport(data);
})();
</script>
</body>
</html>
